[project]
name = "ai-portfolio-backend"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "python-dotenv>=1,<2",
    "httpx>=0.28,<1",
    "openai>=3.46.0",
    "pypdf>=7.0.0",
    "python-multipart>=0.0.33",
    "pillow>=13.0.0",
    "defusedxml>=0.7.1",
    "tiktoken>=0.12,<1",
    "langgraph>=1,<2",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
fail_under = 80

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Form", "fastapi.Query"]
